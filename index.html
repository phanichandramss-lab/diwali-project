cat > index.html <<'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Diwali Celebration</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  background: radial-gradient(circle at 50% 35%, #172b65 0%, #08142f 48%, #020817 100%);
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.scene {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 28px 18px;
  gap: 18px;
}

.tag {
  color: #80d8ff;
  letter-spacing: 4px;
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: clamp(42px, 9vw, 96px);
  line-height: 1.05;
  color: #ffd76a;
  text-shadow: 0 0 12px #ff9d00, 0 0 32px #ff5e00;
  animation: glow 2s ease-in-out infinite alternate;
}

.sub {
  font-size: clamp(17px, 3vw, 25px);
  color: #fff2d0;
}

.diya {
  font-size: 52px;
  filter: drop-shadow(0 0 16px #ff9d00);
  animation: flicker .8s infinite alternate;
}

.pipeline {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 9px;
  max-width: 900px;
  margin-top: 12px;
}

.step {
  padding: 12px 15px;
  border: 1px solid #39c9ff;
  border-radius: 12px;
  background: rgba(5, 28, 65, .82);
  box-shadow: 0 0 14px rgba(0,190,255,.25);
  font-size: 14px;
  color: #dff8ff;
}

.arrow {
  color: #ffc857;
  font-size: 22px;
}

.footer {
  color: #a9c7e8;
  font-size: 13px;
  margin-top: 12px;
}

@keyframes glow {
  from { filter: drop-shadow(0 0 4px #ff9d00); }
  to { filter: drop-shadow(0 0 22px #ff5e00); }
}

@keyframes flicker {
  from { transform: scale(1) rotate(-3deg); }
  to { transform: scale(1.08) rotate(3deg); }
}

@media (max-width: 560px) {
  .step { font-size: 12px; padding: 10px; }
  .arrow { font-size: 16px; }
}
</style>
</head>

<body>
<canvas id="fireworks"></canvas>

<main class="scene">
  <div class="tag">Build • Deploy • Celebrate</div>
  <div class="diya">🪔</div>
  <h1>Happy Diwali!</h1>
  <div class="sub">Wishing everyone a bright, successful & bug-free year.</div>

  <div class="pipeline" aria-label="DevOps pipeline">
    <div class="step">💻 GitHub</div>
    <div class="arrow">→</div>
    <div class="step">⚙️ Jenkins CI/CD</div>
    <div class="arrow">→</div>
    <div class="step">🐳 Docker</div>
    <div class="arrow">→</div>
    <div class="step">☸ Kubernetes</div>
    <div class="arrow">→</div>
    <div class="step">☁️ AWS</div>
  </div>

  <div class="footer">
    May your deployments be smooth and your happiness highly available. 🚀
  </div>
</main>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
let w, h, particles = [];

function resize() {
  w = canvas.width = window.innerWidth * devicePixelRatio;
  h = canvas.height = window.innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  w = window.innerWidth;
  h = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

function burst(x, y) {
  const hue = Math.floor(Math.random() * 360);
  const count = 55 + Math.floor(Math.random() * 35);

  for (let i = 0; i < count; i++) {
    const angle = Math.PI * 2 * i / count;
    const speed = 1.2 + Math.random() * 4.2;

    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 65 + Math.random() * 35,
      max: 100,
      hue,
      size: 1.2 + Math.random() * 2.2
    });
  }
}

function animate() {
  ctx.fillStyle = "rgba(2, 8, 23, 0.20)";
  ctx.fillRect(0, 0, w, h);

  if (Math.random() < 0.045) {
    burst(
      40 + Math.random() * (w - 80),
      45 + Math.random() * h * 0.55
    );
  }

  particles = particles.filter(p => p.life > 0);

  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.025;
    p.vx *= 0.992;
    p.vy *= 0.992;
    p.life--;

    ctx.beginPath();
    ctx.fillStyle = `hsla(${p.hue}, 100%, 65%, ${p.life / p.max})`;
    ctx.shadowBlur = 12;
    ctx.shadowColor = ctx.fillStyle;
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.shadowBlur = 0;
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
EOF
